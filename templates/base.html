<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 PromoMax - Página de Divulgação</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(90deg, #ee4d2d, #ff7337);
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 5px 0 10px;
            font-size: 14px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            margin: 0 6px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 20px;
            transition: 0.2s;
        }

        nav a:hover {
            background: rgba(255,255,255,0.25);
        }

        .busca {
            margin-top: 15px;
        }

        .busca input {
            width: 320px;
            max-width: 90%;
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .barra-oferta {
            background: #d90000;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* RESPONSIVO */
        @media (max-width: 600px) {
            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                margin: 5px;
            }

            .busca input {
                width: 90%;
            }
        }
    </style>

</head>

<body>

<header>

    <h1>🛒 PromoMax</h1>
    <p>🔥 As melhores ofertas da internet selecionadas para você</p>

    <nav>
        <a href="/">🏠 Todos</a>
        <a href="/categoria/Moda">👗 Moda</a>
        <a href="/categoria/Casa">🏠 Casa</a>
        <a href="/categoria/Esportes">⚽ Esportes</a>
        <a href="/categoria/Informatica">💻 Informática</a>
    </nav>

    <form method="GET" action="/" class="busca">
        <input name="q" placeholder="🔎 Buscar produtos..." value="{{ busca or '' }}">
    </form>

</header>

<div class="barra-oferta">
    ⏰ OFERTAS ATUALIZADAS EM TEMPO REAL
</div>

{% block content %}{% endblock %}

</body>
</html>
